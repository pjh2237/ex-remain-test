<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>前任残留度测试</title>
<style>
:root{--primary:#6c5ce7;--primary-light:#a29bfe;--accent:#fd79a8;--text:#2d3436;--text-light:#636e72;--radius:20px;--shadow:0 10px 40px rgba(108,92,231,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#e8e4f8 0%,#fce4ec 30%,#e8e4f8 60%,#f3e5f5 100%);background-attachment:fixed;min-height:100vh;color:var(--text);line-height:1.6}
.header{text-align:center;padding:48px 20px 20px}
.header .icon{font-size:56px;margin-bottom:8px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.header h1{font-size:2.2rem;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px}
.header .subtitle{font-size:1.05rem;color:var(--text-light);font-weight:500}
.header .badge{display:inline-block;margin-top:12px;padding:6px 18px;background:#fff;border-radius:50px;font-size:.85rem;color:var(--primary);font-weight:600;box-shadow:0 2px 12px rgba(108,92,231,.12)}
.container{max-width:760px;margin:0 auto;padding:0 20px 60px}
.start-section{text-align:center;margin:40px 0}
.start-btn{display:inline-block;padding:20px 56px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border:none;border-radius:50px;font-size:1.2rem;font-weight:700;cursor:pointer;box-shadow:0 8px 30px rgba(108,92,231,.3);transition:all .3s ease;letter-spacing:1px;position:relative;overflow:hidden}
.start-btn::after{content:"";position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent,rgba(255,255,255,.15),transparent);transform:rotate(45deg);transition:all .6s}
.start-btn:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(108,92,231,.4)}
.start-btn:hover::after{left:100%}
.result-types-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:24px}
.type-preview{background:#fff;border-radius:16px;padding:0 0 14px;text-align:center;box-shadow:var(--shadow);overflow:hidden;transition:all .3s ease}
.type-preview:hover{transform:translateY(-4px);box-shadow:0 16px 48px rgba(108,92,231,.15)}
.type-preview .tp-img{width:100%;height:auto;display:block;object-fit:cover}
.type-preview .tp-name{font-size:.88rem;font-weight:700;margin:8px 0 3px;padding:0 8px}
.type-preview .tp-range{font-size:.68rem;color:var(--text-light);margin-bottom:4px}
.type-preview .tp-tagline{font-size:.7rem;color:var(--text-light);font-style:italic;line-height:1.35;padding:0 8px}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:200;justify-content:center;align-items:center;animation:fadeIn .2s}
.modal-overlay.active{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{background:#fff;border-radius:var(--radius);padding:40px 32px;text-align:center;max-width:380px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:scaleIn .3s ease}
@keyframes scaleIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal-box .modal-icon{font-size:48px;margin-bottom:12px}
.modal-box h3{font-size:1.2rem;margin-bottom:8px;color:var(--text)}
.modal-box input{width:100%;padding:14px 18px;border:2px solid #e0ddf5;border-radius:14px;font-size:1.1rem;text-align:center;letter-spacing:4px;outline:none;transition:border .2s;margin:16px 0}
.modal-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(108,92,231,.12)}
.modal-box .code-submit{padding:12px 44px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border:none;border-radius:50px;font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s}
.modal-box .code-submit:hover{box-shadow:0 8px 24px rgba(108,92,231,.3);transform:translateY(-2px)}
.modal-box .code-error{color:#e17055;font-size:.85rem;margin-top:8px;display:none}
.quiz-area{display:none}
.quiz-area.active{display:block}
.question-card{background:#fff;border-radius:var(--radius);padding:32px 28px;margin-bottom:14px;box-shadow:var(--shadow);animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.q-num{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;background:linear-gradient(135deg,var(--primary-light),var(--primary));color:#fff;border-radius:12px;font-size:.85rem;font-weight:700;margin-bottom:14px}
.q-text{font-size:1.08rem;font-weight:600;margin-bottom:8px;line-height:1.7;color:var(--text)}
.q-hint{font-size:.8rem;color:var(--text-light);margin-bottom:18px;font-style:italic;padding:4px 12px;background:#f8f7ff;border-radius:8px;display:inline-block}
.options{display:flex;flex-direction:column;gap:10px}
.option-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px 18px;border:2px solid #e8e4f8;border-radius:14px;background:#fafafe;cursor:pointer;font-size:.92rem;font-weight:500;color:var(--text-light);text-align:left;transition:all .2s ease;user-select:none}
.option-btn:hover{border-color:var(--primary-light);background:#f0edff;color:var(--primary);transform:translateX(4px)}
.option-btn.selected{border-color:var(--primary);background:linear-gradient(135deg,#f0edff,#e8e4f8);color:var(--primary);box-shadow:0 4px 16px rgba(108,92,231,.2);font-weight:700;transform:translateX(6px)}
.opt-label{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;background:#e8e4f8;color:var(--primary);border-radius:10px;font-size:.8rem;font-weight:700;flex-shrink:0}
.option-btn.selected .opt-label{background:var(--primary);color:#fff}
.q-nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px}
.q-nav button{padding:12px 32px;border-radius:50px;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s}
.q-nav .nav-prev{background:#fff;color:var(--primary);border:2px solid var(--primary)}
.q-nav .nav-prev:hover{background:#f0edff}
.q-nav .nav-next,.q-nav .nav-submit{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border:none;box-shadow:0 4px 16px rgba(108,92,231,.25)}
.q-nav .nav-next:hover,.q-nav .nav-submit:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(108,92,231,.35)}
.q-nav .nav-prev:disabled{opacity:.35;cursor:not-allowed}
.must-answer-msg{text-align:center;color:#e17055;font-size:.85rem;margin-top:8px;display:none}
.progress-wrap{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:14px 24px;border-radius:0 0 20px 20px;box-shadow:0 4px 24px rgba(0,0,0,.06);display:none;align-items:center;gap:14px}
.progress-wrap.active{display:flex}
.progress-bar{flex:1;height:10px;background:#e0ddf5;border-radius:5px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary-light),var(--primary),var(--accent));border-radius:5px;transition:width .5s ease;width:0;box-shadow:0 0 8px rgba(108,92,231,.3)}
.progress-text{font-size:.85rem;font-weight:700;color:var(--primary);white-space:nowrap}
.result-area{display:none}
.result-area.active{display:block;animation:fadeIn .4s ease}
.result-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.rc-header{padding:18px 18px 0;text-align:center}
.rc-header .type-preview{background:transparent;box-shadow:none;padding:0 0 8px;border-radius:0;max-width:340px;margin:0 auto}
.rc-header .type-preview:hover{transform:none;box-shadow:none}
.rc-header .tp-img{border-radius:var(--radius) var(--radius) 0 0}
.rc-header .tp-name{font-size:.92rem}
.rc-header .tp-range{font-size:.72rem}
.rc-header .tp-tagline{font-size:.72rem}
.dim-breakdown{padding:6px 22px 18px;text-align:left}
.dim-breakdown h4{font-size:.9rem;font-weight:700;color:var(--text);margin-bottom:12px;text-align:center}
.dim-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dim-row .dim-ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;color:#fff}
.dim-row .dim-label{font-size:.78rem;font-weight:600;width:70px;text-align:right;flex-shrink:0}
.dim-row .dim-bar-wrap{flex:1;height:8px;background:#f0edff;border-radius:5px;overflow:hidden}
.dim-row .dim-bar-fill{height:100%;border-radius:5px;transition:width .8s ease}
.dim-row .dim-score{font-size:.75rem;font-weight:700;min-width:50px;text-align:right;flex-shrink:0}
.result-desc{font-size:.92rem;color:var(--text-light);line-height:1.75;padding:18px 24px 4px;text-align:center}
.radar-section{background:linear-gradient(180deg,#faf9ff,#fff);padding:16px 14px 0;text-align:center;border-top:1px solid #f0edff}
.radar-title{font-size:1rem;font-weight:800;color:var(--primary);margin-bottom:4px}
.radar-tip-text{font-size:.72rem;color:#b0b4c8;margin-bottom:4px}
.radar-canvas-wrap{position:relative;height:330px;max-width:440px;margin:0 auto}
.radar-tip{position:absolute;display:none;pointer-events:none;background:rgba(45,52,54,.92);color:#fff;font-size:.78rem;font-weight:600;padding:6px 10px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-135%);box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:5}
.hc-advice{padding:4px 24px 10px;text-align:left}
.hc-advice .hc-quote{font-size:.92rem;color:var(--text-light);font-style:italic;margin-bottom:14px;padding:12px 16px;background:#f8f7ff;border-radius:12px;border-left:3px solid var(--primary-light)}
.hc-advice h4{font-size:.92rem;font-weight:700;margin:14px 0 8px}
.hc-advice ul{list-style:none;padding:0;margin:0 0 10px}
.hc-advice ul li{padding:5px 0 5px 20px;position:relative;font-size:.86rem;color:var(--text);line-height:1.6}
.hc-advice ul li::before{content:"";position:absolute;left:4px;top:12px;width:6px;height:6px;background:var(--primary-light);border-radius:50%}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.action-btn{padding:11px 22px;border:2px solid var(--primary);border-radius:50px;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .3s ease;background:#fff;color:var(--primary)}
.action-btn:hover{background:var(--primary);color:#fff;box-shadow:0 8px 24px rgba(108,92,231,.25)}
.action-btn.primary{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border:none}
.action-btn.primary:hover{box-shadow:0 10px 30px rgba(108,92,231,.35);transform:translateY(-2px)}
.action-btn.ghost{color:var(--text-light);border-color:#d9d5f2;background:#fff}
.action-btn.ghost:hover{background:#f0edff;color:var(--primary);box-shadow:none;transform:none}
.retest-row{margin-top:14px}
.share-inline{margin-top:18px;padding:20px 14px 24px;border-top:2px dashed #e8eaf6;background:linear-gradient(180deg,#fdfbff,#fff);text-align:center}
.share-inline .share-label{font-size:.9rem;font-weight:700;color:var(--primary);margin-bottom:12px}
.share-card-visual{max-width:300px;margin:0 auto 12px;text-align:center}
.share-card-visual .type-preview{background:transparent;box-shadow:none;padding:0 0 8px;border-radius:0}
.share-card-visual .type-preview:hover{transform:none;box-shadow:none}
.share-card-visual .type-preview .tp-img{max-width:100%;border-radius:var(--radius)}
@media(max-width:520px){
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:rgba(45,52,54,.95);color:#fff;font-size:.88rem;font-weight:600;padding:10px 22px;border-radius:50px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;visibility:hidden;transition:all .35s ease;z-index:300;pointer-events:none;max-width:80vw;text-align:center}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.header h1{font-size:1.5rem}
.question-card{padding:20px 16px}
.option-btn{font-size:.85rem;padding:12px 14px}
.result-types-grid{grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.type-preview{padding:0 0 12px;border-radius:14px}
.type-preview .tp-name{font-size:.8rem;margin:6px 0 2px;padding:0 6px}
.type-preview .tp-range{font-size:.62rem;margin-bottom:3px}
.type-preview .tp-tagline{font-size:.64rem;padding:0 6px}
.rc-header{padding:12px 12px 0}
.rc-header .type-preview{max-width:280px}
.rc-header .tp-name{font-size:.88rem}
.radar-section{padding:12px 8px 0}
.radar-title{font-size:.95rem}
.radar-canvas-wrap{height:300px}
.dim-breakdown{padding:4px 14px 14px}
.result-desc{padding:14px 16px 4px;font-size:.88rem}
.hc-advice{padding:2px 16px 8px}
.hc-advice .hc-quote{font-size:.86rem;padding:10px 12px}
.hc-advice ul li{font-size:.83rem}
.share-inline{padding:16px 8px 20px}
.share-card-visual{max-width:260px}
.action-btn{padding:10px 16px;font-size:.85rem}
.dim-row .dim-label{width:62px;font-size:.75rem}
}

</style>
</head>
<body>
<div class="header"><div class="icon">💔</div><h1>前任残留度测试</h1><p class="subtitle">20道情景行为题 · 5维深度评估</p><div class="badge">🔬 基于情感心理学设计</div></div>
<div class="container">
<div id="landing">
<div class="start-section"><button class="start-btn" onclick="showCodeModal()">🚀 开始前任残留度测试</button></div>
<div class="result-types-grid">
<div class="type-preview"><img src="img/card_0_8.png" alt="前任注销型" class="tp-img" loading="lazy"><div class="tp-name" style="color:#00b894">前任注销型</div><div class="tp-range">0-8 分</div><div class="tp-tagline">你已经赢了，TA算什么。</div></div>
<div class="type-preview"><img src="img/card_9_16.png" alt="蚊子包型" class="tp-img" loading="lazy"><div class="tp-name" style="color:#74b9ff">蚊子包型</div><div class="tp-range">9-16 分</div><div class="tp-tagline">不痒不痛，但偶尔会想起。</div></div>
<div class="type-preview"><img src="img/card_17_25.png" alt="淡疤型" class="tp-img" loading="lazy"><div class="tp-name" style="color:#fdcb6e">淡疤型</div><div class="tp-range">17-25 分</div><div class="tp-tagline">平时没事，变天才知道。</div></div>
<div class="type-preview"><img src="img/card_26_34.png" alt="手贱抠痂型" class="tp-img" loading="lazy"><div class="tp-name" style="color:#e17055">手贱抠痂型</div><div class="tp-range">26-34 分</div><div class="tp-tagline">你以为好了，碰一下还出血。</div></div>
<div class="type-preview"><img src="img/card_35_45.png" alt="赛博望夫石型" class="tp-img" loading="lazy"><div class="tp-name" style="color:#e84393">赛博望夫石型</div><div class="tp-range">35-45 分</div><div class="tp-tagline">朋友圈监控员持证上岗。</div></div>
<div class="type-preview"><img src="img/card_46_60.png" alt="单方面复婚型" class="tp-img" loading="lazy"><div class="tp-name" style="color:#6c5ce7">单方面复婚型</div><div class="tp-range">46-60 分</div><div class="tp-tagline">你已经把前任接回去住了。</div></div>
</div></div>
<div class="modal-overlay" id="codeModal"><div class="modal-box"><div class="modal-icon">🔒</div><h3>请输入测试码</h3><input type="password" id="codeInput" placeholder="输入测试码"><br><button class="code-submit" onclick="verifyCode()">确认</button><p class="code-error" id="codeError">测试码错误，请重试</p></div></div>
<div class="progress-wrap" id="pw"><div class="progress-bar"><div class="progress-fill" id="pf"></div></div><span class="progress-text" id="pt">1 / 20</span></div>
<div class="quiz-area" id="quizArea"><div id="quizContainer"></div>
<div class="q-nav"><button class="nav-prev" id="navPrev" onclick="prevQuestion()" disabled>← 上一题</button><button class="nav-next" id="navNext" onclick="nextQuestion()">下一题 →</button></div>
<p class="must-answer-msg" id="mustAnswerMsg">⚠️ 请先选择你的答案</p></div>
<div class="result-area" id="resultArea">
<div class="result-card" id="resultCard">
  <div class="rc-header" id="rcHeader"></div>
  <div class="radar-section">
    <h3 class="radar-title">📊 五维雷达图</h3>
    <p class="radar-tip-text">👆 点击或滑动雷达图上的圆点，查看各维度得分</p>
    <div class="radar-canvas-wrap"><canvas id="radarCanvas"></canvas><div class="radar-tip" id="radarTip"></div></div>
    <div class="dim-breakdown" id="dimBreakdown"></div>
  </div>
  <p class="result-desc" id="rd"></p>
  <div class="hc-advice" id="hcAdvice"></div>
  <div class="share-inline" id="shareInline">
    <div class="share-label">📤 分享你的测试结果</div>
    <div class="share-card-visual" id="shareCardVisual"></div>
    <div class="btn-row"><button class="action-btn" onclick="copyCard()">📋 复制卡片文字</button><button class="action-btn primary" onclick="shareResult()">📤 分享结果</button></div>
    <div class="retest-row"><button class="action-btn ghost" onclick="resetQuiz()">🔄 重新测试</button></div>
  </div>
</div>
</div>
</div>
<div class="toast" id="toast"></div>

}

  h+='<div class="options">';
  for(var i=0;i<q.opts.length;i++){
    var o=q.opts[i];
    var sel=ANSWERS[q.id]===o.v?" selected":"";
    h+='<button class="option-btn'+sel+'" data-value="'+o.v+'" data-qid="'+q.id+'" onclick="selectOption(this,'+q.id+','+o.v+')"><span class="opt-label">'+o.l+'</span>'+o.t+'</button>';
  }
  h+='</div></div>';
  document.getElementById("quizContainer").innerHTML=h;
  document.getElementById("navPrev").disabled=(idx===0);
  var isLast=(idx===TOTAL_Q-1);
  var nb=document.getElementById("navNext");
  if(isLast){nb.textContent="✅ 提交查看结果";nb.className="nav-submit";nb.onclick=submitQuiz;}
  else{nb.textContent="下一题 →";nb.className="nav-next";nb.onclick=nextQuestion;}
  document.getElementById("mustAnswerMsg").style.display="none";
}

function selectOption(btn,qid,val){
  ANSWERS[qid]=val;
  var bs=document.querySelectorAll('[data-qid="'+qid+'"]');
  for(var i=0;i<bs.length;i++){bs[i].classList.remove("selected");}
  btn.classList.add("selected");
  updateProgress();
  setTimeout(function(){
    var isLast=(CURRENT_Q===TOTAL_Q-1);
    if(isLast)submitQuiz();else nextQuestion();
  },350);
}

function nextQuestion(){
  var q=QUESTIONS[CURRENT_Q];
  if(ANSWERS[q.id]===undefined){document.getElementById("mustAnswerMsg").style.display="block";return;}
  CURRENT_Q++;renderQuestion(CURRENT_Q);
  window.scrollTo({top:0,behavior:"smooth"});
}

function prevQuestion(){
  CURRENT_Q--;renderQuestion(CURRENT_Q);
  window.scrollTo({top:0,behavior:"smooth"});
}

function updateProgress(){
  var n=Object.keys(ANSWERS).length;
  document.getElementById("pf").style.width=(n/TOTAL_Q*100)+"%";
  document.getElementById("pt").textContent=(CURRENT_Q+1)+" / "+TOTAL_Q;
}

function submitQuiz(){
  var q=QUESTIONS[CURRENT_Q];
  if(ANSWERS[q.id]===undefined){document.getElementById("mustAnswerMsg").style.display="block";return;}
  showResult();
}

function getCardKey(R){
  return R.min+"_"+R.max;
}

function showResult(){
  var total=0;
  for(var k in ANSWERS)total+=ANSWERS[k];
  var dimScores={};
  DIMS.forEach(function(d){dimScores[d.id]=0;});
  QUESTIONS.forEach(function(q){if(ANSWERS[q.id]!==undefined)dimScores[q.dim]+=ANSWERS[q.id];});
  var R=RESULTS.find(function(r){return total>=r.min&&total<=r.max;});

  var ck=getCardKey(R);
  var cardInner=CARD_LOOKUP[ck]||"";
  var cardFull='<div class="type-preview">'+cardInner+'</div>';

  // 1) Top card image: same card as homepage preview
  document.getElementById("rcHeader").innerHTML=cardFull;

  // 2) Bottom share card: same card as homepage preview
  document.getElementById("shareCardVisual").innerHTML=cardFull;

  // 3) Text description
  document.getElementById("rd").textContent=R.desc;

  // 4) Coping advice merged into the same module card
  var hc=document.getElementById("hcAdvice");
  hc.innerHTML='<div class="hc-quote">💬 '+R.tagline+'</div>';
  if(R.advice && R.advice.length){
    R.advice.forEach(function(a){
      hc.innerHTML+='<h4 style="color:'+R.color+'">'+a.title+'</h4><ul>';
      a.items.forEach(function(i){hc.innerHTML+='<li>'+i+'</li>';});
      hc.innerHTML+='</ul>';
    });
  }

  document.getElementById("quizArea").classList.remove("active");
  document.getElementById("pw").classList.remove("active");
  document.getElementById("resultArea").classList.add("active");
  document.getElementById("resultArea").scrollIntoView({behavior:"smooth"});

  setTimeout(function(){drawRadarChart(dimScores,R.color);buildDimBreakdown(dimScores,R.color);},200);
  window._result={total:total,type:R.type,emoji:R.emoji,desc:R.desc,tagline:R.tagline};
}

function drawRadarChart(scores,color){
  var c=document.getElementById("radarCanvas");
  var tip=document.getElementById("radarTip");
  var dpr=window.devicePixelRatio||1;
  var n=DIMS.length;
  var maxVal=12;
  var S={ready:false,active:null,w:0,h:0,cx:0,cy:0,maxR:0,ctx:null};

  function layout(){
    var wrap=c.parentElement;
    var w=Math.max(240,Math.min(wrap.clientWidth||380,440));
    var h=Math.min(w*0.84,330);
    return {w:w,h:h};
  }
  function setup(w,h){
    c.width=w*dpr;c.height=h*dpr;c.style.width=w+"px";c.style.height=h+"px";
    var ctx=c.getContext("2d");
    ctx.setTransform(dpr,0,0,dpr,0,0);
    return ctx;
  }
  function hexToRgba(hex,a){
    var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return "rgba("+r+","+g+","+b+","+a+")";
  }
  function vertexPos(j){
    var a=-Math.PI/2+j*2*Math.PI/n;
    var v=(scores[DIMS[j].id]||0);
    var rr=S.maxR*v/maxVal;
    return {x:S.cx+rr*Math.cos(a),y:S.cy+rr*Math.sin(a)};
  }
  function drawGrid(ctx){
    ctx.save();
    var lv=[3,6,9,12];
    for(var i=0;i<lv.length;i++){
      var rr=S.maxR*lv[i]/maxVal;
      ctx.beginPath();
      for(var j=0;j<n;j++){
        var a=-Math.PI/2+j*2*Math.PI/n;
        var x=S.cx+rr*Math.cos(a),y=S.cy+rr*Math.sin(a);
        if(j===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.closePath();
      ctx.strokeStyle=i===lv.length-1?"#cfd4e8":"#e8eaf6";
      ctx.lineWidth=i===lv.length-1?1.2:1;
      ctx.stroke();
      ctx.fillStyle="#b0b4c8";ctx.font="9px -apple-system,PingFang SC,sans-serif";
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText(lv[i],S.cx,S.cy-rr-8);
    }
    for(var j=0;j<n;j++){
      var a=-Math.PI/2+j*2*Math.PI/n;
      ctx.beginPath();ctx.moveTo(S.cx,S.cy);
      ctx.lineTo(S.cx+S.maxR*Math.cos(a),S.cy+S.maxR*Math.sin(a));
      ctx.strokeStyle="#e8eaf6";ctx.lineWidth=1;ctx.stroke();
      var lx=S.cx+(S.maxR+28)*Math.cos(a),ly=S.cy+(S.maxR+28)*Math.sin(a);
      ctx.fillStyle="#2d3436";ctx.font="600 11px -apple-system,PingFang SC,Microsoft YaHei,sans-serif";
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText(DIMS[j].icon+" "+DIMS[j].name,lx,ly);
    }
    ctx.beginPath();ctx.arc(S.cx,S.cy,3,0,Math.PI*2);
    ctx.fillStyle="#cfd4e8";ctx.fill();
    ctx.restore();
  }
  function drawData(ctx,t,active){
    ctx.save();
    ctx.beginPath();
    for(var j=0;j<n;j++){
      var a=-Math.PI/2+j*2*Math.PI/n;
      var v=(scores[DIMS[j].id]||0);
      var rr=S.maxR*v/maxVal*t;
      var x=S.cx+rr*Math.cos(a),y=S.cy+rr*Math.sin(a);
      if(j===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.closePath();
    var grad=ctx.createLinearGradient(0,S.cy-S.maxR,0,S.cy+S.maxR);
    grad.addColorStop(0,hexToRgba(color,0.45));
    grad.addColorStop(1,hexToRgba(color,0.08));
    ctx.fillStyle=grad;ctx.fill();
    ctx.strokeStyle=color;ctx.lineWidth=2.4;
    ctx.shadowColor=hexToRgba(color,0.55);ctx.shadowBlur=14;
    ctx.stroke();
    ctx.shadowBlur=0;
    for(var j=0;j<n;j++){
      var a=-Math.PI/2+j*2*Math.PI/n;
      var v=(scores[DIMS[j].id]||0);
      var rr=S.maxR*v/maxVal*t;
      var x=S.cx+rr*Math.cos(a),y=S.cy+rr*Math.sin(a);
      var big=(active===j);
      ctx.beginPath();ctx.arc(x,y,big?10:6,0,Math.PI*2);
      ctx.fillStyle="#fff";ctx.fill();
      ctx.strokeStyle=color;ctx.lineWidth=big?3.5:3;ctx.stroke();
      if(big){
        ctx.beginPath();ctx.arc(x,y,16,0,Math.PI*2);
        ctx.strokeStyle=hexToRgba(color,0.35);ctx.lineWidth=2;ctx.stroke();
      }
    }
    ctx.restore();
  }
  function render(t,active){
    var ctx=S.ctx;
    ctx.clearRect(0,0,S.w,S.h);
    drawGrid(ctx);
    drawData(ctx,t,active);
  }

  var L=layout();
  S.w=L.w;S.h=L.h;S.cx=L.w/2;S.cy=L.h/2+4;
  S.maxR=Math.min(L.w,L.h)/2-50;
  S.ctx=setup(L.w,L.h);
  S.active=null;
  S.ready=false;

  var startT=null,duration=750;
  function frame(ts){
    if(startT===null)startT=ts;
    var p=Math.min((ts-startT)/duration,1);
    var ease=1-Math.pow(1-p,3);
    render(ease,null);
    if(p<1)requestAnimationFrame(frame);
    else S.ready=true;
  }
  requestAnimationFrame(frame);

  function hitTest(px,py){
    for(var j=0;j<n;j++){
      var p=vertexPos(j);
      var dx=px-p.x,dy=py-p.y;
      if(dx*dx+dy*dy<28*28)return j;
    }
    return -1;
  }
  function showTip(j,x,y){
    var d=DIMS[j];
    var v=(scores[d.id]||0);
    tip.innerHTML=d.icon+" "+d.name+"：<b>"+v+"</b> / "+maxVal+" 分";
    tip.style.left=(c.offsetLeft+x)+"px";
    tip.style.top=(c.offsetTop+y)+"px";
    tip.style.display="block";
  }
  function hideTip(){tip.style.display="none";}
  function onPointer(e){
    if(!S.ready)return;
    var rect=c.getBoundingClientRect();
    var x=e.clientX-rect.left,y=e.clientY-rect.top;
    var j=hitTest(x,y);
    if(j>=0){
      S.active=j;
      showTip(j,x,y);
      c.style.cursor="pointer";
    }else{
      S.active=null;
      hideTip();
      c.style.cursor="default";
    }
    render(1,S.active);
  }
  function onLeave(){
    hideTip();
    S.active=null;
    c.style.cursor="default";
    if(S.ready)render(1,null);
  }
  c.onpointermove=onPointer;
  c.onpointerdown=onPointer;
  c.onpointerleave=onLeave;

  window.onresize=function(){
    var L2=layout();
    if(L2.w!==S.w||L2.h!==S.h){
      S.w=L2.w;S.h=L2.h;S.cx=L2.w/2;S.cy=L2.h/2+4;
      S.maxR=Math.min(L2.w,L2.h)/2-50;
      S.ctx=setup(L2.w,L2.h);
      render(1,S.active);
    }
  };
}

function buildDimBreakdown(scores,color){
  var wrap=document.getElementById("dimBreakdown");
  var h='<h4 class="dim-title">📊 各维度得分</h4>';
  var cols={c1:"#a29bfe",c2:"#fd79a8",c3:"#fdcb6e",c4:"#e17055",c5:"#00cec9"};
  DIMS.forEach(function(d){
    var v=scores[d.id];
    var pct=Math.min(v/12*100,100);
    var c=cols[d.c]||color;
    h+='<div class="dim-row"><span class="dim-ic" style="background:'+c+'">'+d.icon+'</span><span class="dim-label">'+d.name+'</span><div class="dim-bar-wrap"><div class="dim-bar-fill" style="width:'+pct+'%;background:linear-gradient(90deg,'+c+'88,'+c+')"></div></div><span class="dim-score" style="color:'+c+'">'+v+' / 12</span></div>';
  });
  wrap.innerHTML=h;
}

function shareResult(){
  var r=window._result;
  var tx="前任残留度测试"+" : "+r.total+"分"+" - "+r.type;
  if(navigator.share){navigator.share({title:"前任残留度测试",text:tx});}
  else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tx).then(function(){showToast("✅ 已复制");});}
  else{showToast("⚠️ 复制失败，请手动复制");}
}

function copyCard(){
  var r=window._result;
  var tx="前任残留度测试"+"\n"+r.emoji+" "+r.type+" | "+r.total+"分"+"\n\n"+r.tagline+"\n"+r.desc;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(tx).then(function(){showToast("✅ 卡片文字已复制");});
  }else{showToast("⚠️ 复制失败，请手动复制");}
}

function resetQuiz(){
  document.getElementById("landing").style.display="";
  document.getElementById("quizArea").classList.remove("active");
  document.getElementById("pw").classList.remove("active");
  document.getElementById("resultArea").classList.remove("active");
  document.getElementById("codeModal").classList.remove("active");
  ANSWERS={};CURRENT_Q=0;
  window.scrollTo({top:0,behavior:"smooth"});
}

var _toastTimer=null;
function showToast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg;
  t.classList.add("show");
  if(_toastTimer)clearTimeout(_toastTimer);
  _toastTimer=setTimeout(function(){t.classList.remove("show");},2000);
}

</script>
